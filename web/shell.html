<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Chaos Groove GLX</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">
    <!-- Favicons -->
    <link rel="icon" type="image/x-icon" href="icon.ico">
    <link rel="icon" type="image/png" sizes="256x256" href="icon.png">

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100svh; /* safe viewport */
            min-height: 100lvh; /* large viewport */
            min-height: 100dvh; /* dynamic viewport */
            overflow: auto;
            background: black;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            /* Push content below browser UI */
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
            background-image: url('icon.png');
            background-repeat: repeat;
            background-size: 680px 256px;
            background-color: rgba(0, 0, 0, 0.6); /* semi-transparent tint */
            background-blend-mode: multiply; /* blends tint with image */
        }

        canvas {
            max-width: 100vw; /*calc(100vh * (1280 / 960)); - upscale*/
            max-height: 100vh;
            width: auto;
            height: auto;
            object-fit: contain; /* helps non-WebGL canvases */
            display: block;
            margin: auto;
            box-sizing: content-box;
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-family: sans-serif;
        }

        #status-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            font-family: sans-serif;
            cursor: pointer;
        }

        #status-text {
            padding: 30px;
            border-radius: 60px;
            font-size: 2em;
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.7);
            background-color: rgba(0, 0, 0, 0.5);
        }
    </style>
</head>

<body>
    <!-- The loading state -->
    <div id="status-container">
        <div id="status-text">LOADING...</div>
    </div>

    <canvas class=emscripten id=canvas oncontextmenu=event.preventDefault() tabindex=-1></canvas>

    <script>
        var Module = {
            noInitialRun: true,
            canvas: (function () {
                var canvas = document.getElementById('canvas');
                return canvas;
            })()
        };
        // Hide loading text once WASM is ready
        if (typeof Module !== 'undefined') {
            Module.onRuntimeInitialized = function () {
                //mount persistant storage
                if (!FS.analyzePath('/persist').exists) {
                    FS.mkdir('/persist');
                }
                FS.mount(IDBFS, {}, '/persist');
                // Pull persistent data into memory
                FS.syncfs(true, () => {
                    // Overwrite files the app expects
                    if (FS.analyzePath('/persist/Game_Options.ini').exists) {
                        FS.writeFile(
                            '/Text_Files/Game_Options.ini',
                            FS.readFile('/persist/Game_Options.ini', { encoding: "utf8" }),
                            { encoding: "utf8" }
                        );
                    }
                    // App will now see swapped files
                    // 0. Get Elements
                    const statusContainer = document.getElementById('status-container');
                    const statusText = document.getElementById('status-text');

                    // 1. Loading is done, update the UI to ask for a touch
                    statusText.innerHTML = "TOUCH TO START";

                    // 2. Wait for user interaction to unlock audio and start the app
                    statusContainer.addEventListener('click', function unlock() {
                        // Resume AudioContext for browsers (Chrome/Firefox/Safari 2026)
                        const AudioContext = window.AudioContext || window.webkitAudioContext;
                        if (AudioContext) {
                            const ctx = new AudioContext();
                            ctx.resume();
                        }
                        var canvas = document.getElementById('canvas');
                        canvas.style.background = 'black';
                        canvas.style.boxShadow = "0 0 3px 3px rgba(15, 12, 12, 0.8)";
                        document.body.style.backgroundColor = "rgb(0,0,0,0.8)";
                        // Remove overlay and start raylib main
                        statusContainer.remove();
                        Module._main(); // start app manually
                    }, { once: true });
                });
            };
        }

        function saveSettings() {

            if (FS.analyzePath('/Text_Files/Game_Options.ini').exists) {
                FS.writeFile(
                    '/persist/Game_Options.ini',
                    FS.readFile('/Text_Files/Game_Options.ini', { encoding: "utf8" }),
                    { encoding: "utf8" }
                );
                FS.syncfs(false, () => { });
            }
        }

        document.addEventListener("visibilitychange", () => {
            if (document.hidden) {
                saveSettings();
            }
        });
        window.addEventListener("beforeunload", saveSettings);

        //---------FULL SCREEN----------
        let lastTap = 0;
        const canvas = document.getElementById('canvas');

        canvas.addEventListener('touchend', function (e) {
            const currentTime = new Date().getTime();
            const tapLength = currentTime - lastTap;

            // Threshold of 300ms is standard for double-taps
            if (tapLength < 300 && tapLength > 0) {
                toggleBrowserFullscreen();
                e.preventDefault(); // Prevents zooming on some mobile browsers
            }
            lastTap = currentTime;
        }, { passive: false });

        function toggleBrowserFullscreen() {
            const el = document.documentElement;

            el.requestFullscreen?.()
                || el.webkitRequestFullscreen?.()
                || el.mozRequestFullScreen?.()
                || el.msRequestFullscreen?.();
        }

    </script>

    {{{ SCRIPT }}}

    <script>if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js'); }</script>
</body>
</html>
